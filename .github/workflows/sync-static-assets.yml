name: Sync Static Assets

on:
  push:
    branches: [main]
    paths:
      - 'frontend/public/**'
      - '.github/workflows/sync-static-assets.yml'
  workflow_dispatch:

jobs:
  sync-assets:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout main repository
        uses: actions/checkout@v4
        with:
          path: main

      - name: Setup git config
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'

      - name: Checkout assets repository
        uses: actions/checkout@v4
        with:
          repository: stexiel/sparkaph-assets
          path: assets
          token: ${{ secrets.ASSETS_REPO_TOKEN }}
          fetch-depth: 0

      - name: Sync static files
        run: |
          # Copy public folder contents to assets repository
          rsync -av --delete main/frontend/public/ assets/
          
          cd assets
          
          # Add all changes
          git add -A
          
          # Commit if there are changes
          if git diff --staged --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Sync static assets from main repository"
            git push origin main
            echo "Static assets synced successfully"
          fi

      - name: Create GitHub Release for assets
        if: success()
        run: |
          cd assets
          # Create a release with the current commit SHA
          RELEASE_TAG="assets-$(git rev-parse --short HEAD)"
          
          # Check if release already exists
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            echo "Release $RELEASE_TAG already exists"
          else
            gh release create "$RELEASE_TAG" \
              --title "Static Assets $RELEASE_TAG" \
              --notes "Static assets synced from main repository commit $(git rev-parse --short HEAD)"
            echo "Release $RELEASE_TAG created"
          fi
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
