services:
  # Backend API
  - type: web
    name: sparkaph-backend
    env: node
    buildCommand: cd backend && npm install && npm run clear-migrations && npx prisma generate && npm run build
    startCommand: cd backend && npx prisma migrate deploy && npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: sparkaph-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: sparkaph-redis
          property: connectionString
      - key: PORT
        value: 3000
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: GITHUB_CLIENT_ID
        sync: false
      - key: GITHUB_CLIENT_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        value: https://sparkaph.com/login/google/callback
      - key: SPARKAPH_AI_API_KEY
        sync: false

  # Frontend
  - type: web
    name: sparkaph-frontend
    env: static
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://sparkaph-backend.onrender.com
      - key: VITE_GITHUB_CLIENT_ID
        sync: false
      - key: VITE_GOOGLE_CLIENT_ID
        sync: false
      - key: VITE_OAUTH_REDIRECT_URI
        value: https://sparkaph.com

databases:
  - name: sparkaph-db
    databaseName: sparkaph
    user: sparkaph

redis:
  - name: sparkaph-redis
    maxmemoryPolicy: allkeys-lru
